<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>換皮活動模擬器 v2</title>
<style>
:root{--ink:#302925;--line:#65483a;--card:#fff9eb;--pink:#ef6aa7;--blue:#55c5e8;--yellow:#ffd66d;--danger:#ffb0b0}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,"Microsoft JhengHei",sans-serif;background:linear-gradient(#70d5eb 0 180px,#f7dda0 180px);color:var(--ink)}
.app{max-width:1180px;margin:auto;padding:12px 12px 50px}.hero,.card{border:4px solid var(--line);border-radius:20px;box-shadow:0 7px 0 #7b5b4933}.hero{background:#8d542f;color:#fff;padding:16px}.hero h1{margin:0}.hero p{color:#ffe8a1;font-weight:bold;margin-bottom:0}
.tools,.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tabs{overflow:auto;flex-wrap:nowrap;position:sticky;top:0;z-index:30;background:#f7dda0dd;padding:7px 0;backdrop-filter:blur(5px)}
button,.file{padding:9px 13px;border:3px solid #493831;border-radius:12px;background:var(--yellow);font-weight:900;cursor:pointer;box-shadow:0 3px 0 #8f654b}.danger{background:var(--danger)}.blue{background:#c8eff9}.green{background:#b9e963}input[type=file]{display:none}.tab{white-space:nowrap}.tab.on{background:var(--pink);color:#fff}
.panel{display:none}.panel.on{display:block}.card{background:var(--card);padding:14px;margin:12px 0}.card h2{margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:780px){.two{grid-template-columns:1fr}}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:430px){.grid{grid-template-columns:1fr}}
label{font-size:13px;font-weight:bold}input,select,textarea{width:100%;margin-top:5px;padding:9px;border:2px solid #a38676;border-radius:9px;font-size:16px;background:#fff;color:#302925}textarea{min-height:74px;resize:vertical}.item{background:#fff;border:3px solid #a7836d;border-radius:14px;padding:10px;margin-top:10px}.head{display:flex;justify-content:space-between;align-items:center;gap:8px}.row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;margin-top:8px}@media(max-width:750px){.row{grid-template-columns:1fr 1fr}}
.preview{background:#edf9fc;border:2px dashed #65a8b8;border-radius:9px;padding:8px;margin-top:8px;font-size:13px;line-height:1.55}.bad{background:#fff0f0;border-color:#d77878}.small{font-size:12px;color:#6e625c;line-height:1.55}.toggle{display:flex;gap:6px;align-items:center;margin-top:8px}.toggle input{width:auto;margin:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}}.stat{background:#fff;border:3px solid #987664;border-radius:12px;padding:9px;text-align:center}.stat b{display:block;font-size:25px}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}th{background:#efdfc8}.ok{color:#27863a;font-weight:bold}.warn{color:#b33b42;font-weight:bold}
.boardWrap{overflow:auto;padding:4px}.board{width:min(100%,760px);min-width:620px;aspect-ratio:9/8;margin:auto;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(8,1fr);gap:5px;position:relative}.tile{border:3px solid #674634;border-radius:12px;background:#ffd878;box-shadow:0 4px 0 #8c6146;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-weight:900;font-size:12px;cursor:pointer;position:relative;padding:3px;overflow:hidden}.tile:nth-child(3n){background:#f4a5e8}.tile:nth-child(3n+1){background:#83dcf2}.tile.selected{outline:5px solid #ff4f86;z-index:5}.tile.current::after{content:'🐹';position:absolute;right:2px;bottom:1px;font-size:24px;filter:drop-shadow(0 2px 0 white)}.tile .no{position:absolute;left:4px;top:2px;font-size:10px;opacity:.7}.tile .ico{font-size:24px;line-height:1}.tile .txt{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.center{grid-column:2/9;grid-row:2/8;border:4px solid #674634;border-radius:22px;background:linear-gradient(45deg,#67cce7 25%,#8fe1f2 25% 50%,#67cce7 50% 75%,#8fe1f2 75%);background-size:42px 42px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px}.center h2{font-size:30px;margin:0 0 8px}.diceBox{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}.dice{width:78px;height:78px;border:4px solid #493831;border-radius:18px;background:#fff9df;display:grid;place-items:center;font-size:46px;font-weight:900}.boardStats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}.pill{background:#352b28;color:#fff;padding:7px 12px;border-radius:999px;font-weight:900}.editorNote{padding:8px;border-left:5px solid #e29930;background:#fff6d9;border-radius:8px}
</style>
</head>
<body><div class="app">
<header class="hero"><h1>🏝️ 換皮活動模擬器 v2</h1><p>活動委託已簡化成每日玩法代幣總量，並加入可編輯的 30 格大富翁。</p></header>
<div class="tools"><button class="green" onclick="saveAll()">💾 儲存</button><button class="blue" onclick="exportJSON()">⬇ 匯出 JSON</button><label class="file">⬆ 匯入 JSON<input id="file" type="file" accept=".json"></label><button onclick="loadExample()">載入夏日範例</button><button class="danger" onclick="resetAll()">全部重設</button></div>
<div class="tabs"><button class="tab on" data-p="basic">活動設定</button><button class="tab" data-p="boardPanel">30 格大富翁</button><button class="tab" data-p="packs">禮包</button><button class="tab" data-p="progress">進度獎勵</button><button class="tab" data-p="exchange">兌換商店</button><button class="tab" data-p="summary">模擬總覽</button></div>

<section id="basic" class="panel on"><div class="card"><h2>活動設定</h2><div class="grid">
<label>活動名稱<input id="eventName" value="夏日環遊"></label><label>活動天數<input id="eventDays" type="number" min="1" value="7"></label><label>目前第幾天<input id="currentDay" type="number" min="1" value="1"></label><label>每日重置時間<input id="resetTime" type="time" value="00:00"></label>
<label>玩法代幣名稱<input id="tokenName" value="骰子"></label><label>每日任務最多取得玩法代幣<input id="dailyTaskToken" type="number" min="0" value="11"></label><label>高級兌換幣名稱<input id="premiumName" value="火龍果汁"></label><label>普通兌換幣名稱<input id="normalName" value="奇異果汁"></label><label>付費貨幣名稱<input id="paidName" value="寶石"></label>
</div></div><div class="card"><h2>積分規則</h2><div class="grid"><label>每獲得 1 個玩法代幣積分<input id="pointsPerToken" type="number" value="2"></label><label>每獲得 1 個高級兌換幣積分<input id="pointsPerPremium" type="number" value="0"></label><label>每完成 1 圈積分<input id="pointsPerLap" type="number" value="10"></label><label>每日進度重置<select id="dailyReset"><option value="yes">是</option><option value="no">否</option></select></label></div><p class="small">已修正注音輸入：輸入文字時不再重建整個清單，因此不會每按一鍵就失去焦點或讓頁面跳動。</p></div></section>

<section id="boardPanel" class="panel"><div class="card"><h2>30 格大富翁</h2><div class="boardWrap"><div class="board" id="board"><div class="center"><h2 id="boardTitle">夏日環遊</h2><div class="diceBox"><div class="dice" id="dice">🎲</div><div><button id="rollBtn" onclick="rollDice()">擲骰子</button><button class="blue" onclick="resetRun()">重設遊玩紀錄</button></div></div><div class="boardStats"><span class="pill">剩餘骰子：<b id="diceLeft">0</b></span><span class="pill">位置：<b id="posText">起點</b></span><span class="pill">圈數：<b id="lapText">0</b></span></div></div></div></div></div>
<div class="two"><div class="card"><h2>遊玩設定</h2><div class="grid"><label>目前擁有骰子<input id="ownedDice" type="number" min="0" value="37"></label><label>目前位置（0～29）<input id="startPosition" type="number" min="0" max="29" value="0"></label><label>每次擲骰消耗<input id="diceCost" type="number" min="1" value="1"></label><label>完成一圈額外獎勵<input id="lapReward" value=""></label></div><div class="actions"><button onclick="applyRunSettings()">套用遊玩設定</button><button onclick="simulateAll()">快速擲完全部骰子</button></div><div id="runResult" class="preview">尚未開始。</div></div>
<div class="card"><h2>格子編輯器</h2><div class="editorNote small">點選棋盤上的格子後修改。文字輸入完成時才更新棋盤，不會中斷注音組字。</div><div class="grid" style="margin-top:10px"><label>格子編號<input id="tileIndex" readonly></label><label>圖示<input id="tileIcon" maxlength="4"></label><label>資源名稱<input id="tileName"></label><label>數量<input id="tileAmount" type="number"></label></div><label style="display:block;margin-top:9px">備註<input id="tileNote"></label><div class="actions"><button onclick="applyTileEdit()">套用此格設定</button><button class="blue" onclick="copyTileToNext()">複製到下一格</button><button class="danger" onclick="clearTile()">清除此格</button></div></div></div></section>

<section id="packs" class="panel"><div class="card"><h2>禮包</h2><div class="actions"><button onclick="addItem('packs')">＋新增禮包</button><button class="danger" onclick="clearList('packs')">清空全部</button></div><div id="packList"></div></div></section>
<section id="progress" class="panel"><div class="card"><h2>進度獎勵</h2><div class="actions"><button onclick="addItem('progress')">＋新增階段</button><button class="danger" onclick="clearList('progress')">清空全部</button></div><div id="progressList"></div></div></section>
<section id="exchange" class="panel"><div class="card"><h2>兌換商店</h2><div class="actions"><button onclick="addItem('exchange','普通')">＋普通兌換</button><button onclick="addItem('exchange','高級')">＋高級兌換</button><button class="danger" onclick="clearList('exchange')">清空全部</button></div><div id="exchangeList"></div></div></section>
<section id="summary" class="panel"><div class="card"><h2>模擬條件</h2><div class="grid"><label>模擬天數<input id="simDays" type="number" value="7"></label><label>預計完成圈數<input id="simLaps" type="number" value="0"></label><label>額外玩法代幣<input id="manualToken" type="number" value="0"></label><label>額外高級兌換幣<input id="manualPremium" type="number" value="0"></label></div><button style="margin-top:10px" onclick="calculateSummary()">重新計算</button></div><div class="card"><h2>結果</h2><div class="stats"><div class="stat">每日任務代幣<b id="sTask">0</b></div><div class="stat">禮包代幣<b id="sPack">0</b></div><div class="stat">高級兌換幣<b id="sPremium">0</b></div><div class="stat">預估積分<b id="sPoints">0</b></div></div></div><div class="two"><div class="card"><h2>資源收入</h2><div id="income"></div></div><div class="card"><h2>禮包花費</h2><div id="cost"></div></div></div><div class="card"><h2>階段判定</h2><div id="tierResult"></div></div></section>
</div>
<script>
'use strict';
const $=s=>document.querySelector(s), num=v=>Number(v)||0, uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let db={packs:[],progress:[],exchange:[],tiles:[]};
let selectedTile=0, run={position:0,dice:0,laps:0,rewards:{},rolling:false};
function defaultTiles(){const sample=[['🏁','起點',0],['💎','寶石',20],['🥝','奇異果汁',8],['💎','寶石',20],['🧪','煉金試劑',1],['🥝','奇異果汁',4],['🧪','煉金試劑',1],['💎','寶石',30],['🔩','零件',5],['🔩','零件',5],['🥝','奇異果汁',2],['💎','寶石',40],['💎','寶石',20],['🥝','奇異果汁',4],['💎','寶石',40],['💎','寶石',30],['🥝','奇異果汁',3],['🧪','煉金試劑',1],['💎','寶石',30],['💎','寶石',40],['💎','寶石',20],['🥝','奇異果汁',5],['💎','寶石',20],['🥝','奇異果汁',8],['🎗️','特殊道具',5],['💎','寶石',20],['💠','晶石',5],['💠','晶石',5],['💎','寶石',20],['💠','晶石',5]];return sample.map((x,i)=>({id:i,icon:x[0],name:x[1],amount:x[2],note:''}))}
function parseItems(t){if(!String(t||'').trim())return[];return String(t).split(/[,，、;\n]+/).map(x=>x.trim()).filter(Boolean).map(x=>{let m=x.match(/^(.+?)\s*[:：xX×]\s*(-?\d+(?:\.\d+)?)$/);return m?{name:m[1].trim(),amount:num(m[2]),ok:true}:{name:x,amount:0,ok:false}})}
function preview(t){const a=parseItems(t);if(!a.length)return '<span class="warn">尚未輸入</span>';return a.map(x=>(x.ok?'✓ ':'✕ ')+esc(x.name)+(x.ok?' × '+x.amount:'（請用 名稱:數量）')).join('<br>')}
function settings(){const ids=['eventName','eventDays','currentDay','resetTime','tokenName','dailyTaskToken','premiumName','normalName','paidName','pointsPerToken','pointsPerPremium','pointsPerLap','dailyReset','simDays','simLaps','manualToken','manualPremium','ownedDice','startPosition','diceCost','lapReward'];let o={};ids.forEach(id=>o[id]=$('#'+id).value);return o}
function applySettings(o){Object.entries(o||{}).forEach(([k,v])=>{let el=$('#'+k);if(el)el.value=v})}
function boardCoords(){let a=[];for(let c=1;c<=9;c++)a.push([1,c]);for(let r=2;r<=8;r++)a.push([r,9]);for(let c=8;c>=1;c--)a.push([8,c]);for(let r=7;r>=2;r--)a.push([r,1]);return a}
function renderBoard(){const board=$('#board');board.querySelectorAll('.tile').forEach(e=>e.remove());const coords=boardCoords();db.tiles.forEach((t,i)=>{const d=document.createElement('div');d.className='tile'+(i===selectedTile?' selected':'')+(i===run.position?' current':'');d.style.gridRow=coords[i][0];d.style.gridColumn=coords[i][1];d.dataset.index=i;d.innerHTML=`<span class="no">${i}</span><span class="ico">${esc(t.icon||'⬜')}</span><span class="txt">${esc(t.name||'空格')}</span><span>×${num(t.amount)}</span>`;d.onclick=()=>selectTile(i);board.appendChild(d)});$('#boardTitle').textContent=$('#eventName').value||'活動大富翁';updateRunUI()}
function selectTile(i){selectedTile=i;const t=db.tiles[i];$('#tileIndex').value=i;$('#tileIcon').value=t.icon;$('#tileName').value=t.name;$('#tileAmount').value=t.amount;$('#tileNote').value=t.note||'';renderBoard()}
function applyTileEdit(){const t=db.tiles[selectedTile];t.icon=$('#tileIcon').value;t.name=$('#tileName').value.trim();t.amount=num($('#tileAmount').value);t.note=$('#tileNote').value.trim();renderBoard()}
function copyTileToNext(){applyTileEdit();const next=(selectedTile+1)%30;db.tiles[next]={...db.tiles[selectedTile],id:next};selectTile(next)}
function clearTile(){db.tiles[selectedTile]={id:selectedTile,icon:'⬜',name:'空格',amount:0,note:''};selectTile(selectedTile)}
function applyRunSettings(){run.position=Math.max(0,Math.min(29,num($('#startPosition').value)));run.dice=Math.max(0,num($('#ownedDice').value));run.laps=0;run.rewards={};$('#runResult').innerHTML='已套用設定，可以開始擲骰子。';renderBoard()}
function updateRunUI(){$('#diceLeft').textContent=run.dice;$('#posText').textContent=run.position===0?'起點':run.position;$('#lapText').textContent=run.laps;$('#rollBtn').disabled=run.rolling||run.dice<num($('#diceCost').value||1)}
function addReward(name,amount){if(name&&amount)run.rewards[name]=(run.rewards[name]||0)+amount}
function land(){const t=db.tiles[run.position];addReward(t.name,t.amount);$('#runResult').innerHTML=`停在第 ${run.position} 格：<b>${esc(t.icon)} ${esc(t.name)} ×${num(t.amount)}</b><br>${rewardText()}`}
function rewardText(){const arr=Object.entries(run.rewards);return arr.length?'累計取得：'+arr.map(([k,v])=>`${esc(k)} ×${v}`).join('、'):'尚未取得資源。'}
async function rollDice(){if(run.rolling)return;const cost=Math.max(1,num($('#diceCost').value));if(run.dice<cost)return;run.rolling=true;run.dice-=cost;let result=1;for(let i=0;i<8;i++){result=1+Math.floor(Math.random()*6);$('#dice').textContent=result;await new Promise(r=>setTimeout(r,55+i*12))}for(let s=0;s<result;s++){const old=run.position;run.position=(run.position+1)%30;if(old===29&&run.position===0){run.laps++;parseItems($('#lapReward').value).filter(x=>x.ok).forEach(x=>addReward(x.name,x.amount))}renderBoard();await new Promise(r=>setTimeout(r,110))}land();run.rolling=false;updateRunUI()}
function resetRun(){run={position:0,dice:0,laps:0,rewards:{},rolling:false};$('#dice').textContent='🎲';$('#runResult').textContent='尚未開始。';applyRunSettings()}
function simulateAll(){applyRunSettings();let safety=100000,cost=Math.max(1,num($('#diceCost').value));while(run.dice>=cost&&safety--){run.dice-=cost;let result=1+Math.floor(Math.random()*6);for(let s=0;s<result;s++){let old=run.position;run.position=(run.position+1)%30;if(old===29&&run.position===0){run.laps++;parseItems($('#lapReward').value).filter(x=>x.ok).forEach(x=>addReward(x.name,x.amount))}}let t=db.tiles[run.position];addReward(t.name,t.amount)}$('#dice').textContent='✓';$('#runResult').innerHTML=`快速模擬完成：${run.laps} 圈，最後停在第 ${run.position} 格。<br>${rewardText()}`;renderBoard()}
function addItem(type,kind){if(type==='packs')db.packs.push({id:uid(),name:'新禮包',priceResource:$('#paidName').value,price:1000,limit:1,planned:0,daily:true,contents:($('#tokenName').value||'玩法代幣')+':10',on:true});if(type==='progress')db.progress.push({id:uid(),tier:db.progress.length+1,threshold:90,rewards:'寶箱:1, 寶石:50',on:true});if(type==='exchange')db.exchange.push({id:uid(),kind:kind||'普通',name:'兌換品',costResource:kind==='高級'?$('#premiumName').value:$('#normalName').value,cost:1,limit:1,rewards:'道具:1',on:true});renderLists()}
function removeItem(type,id){db[type]=db[type].filter(x=>x.id!==id);renderLists()}function duplicateItem(type,id){let x=db[type].find(a=>a.id===id);if(x){x=JSON.parse(JSON.stringify(x));x.id=uid();x.name+='（複製）';db[type].push(x);renderLists()}}function clearList(type){if(confirm('確定清空？')){db[type]=[];renderLists()}}
function setValue(type,id,key,value){let x=db[type].find(a=>a.id===id);if(x)x[key]=value}function buttons(t,id){return `<div><button onclick="duplicateItem('${t}','${id}')">複製</button> <button class="danger" onclick="removeItem('${t}','${id}')">刪除</button></div>`}
function renderLists(){
$('#packList').innerHTML=db.packs.length?db.packs.map((x,i)=>`<div class="item"><div class="head"><b>禮包 ${i+1}</b>${buttons('packs',x.id)}</div><div class="row"><label>名稱<input value="${esc(x.name)}" oninput="setValue('packs','${x.id}','name',this.value)"></label><label>價格貨幣<input value="${esc(x.priceResource)}" oninput="setValue('packs','${x.id}','priceResource',this.value)"></label><label>單價<input type="number" value="${x.price}" oninput="setValue('packs','${x.id}','price',num(this.value))"></label><label>限購<input type="number" value="${x.limit}" oninput="setValue('packs','${x.id}','limit',num(this.value))"></label></div><div class="row"><label>內容物<input value="${esc(x.contents)}" oninput="setValue('packs','${x.id}','contents',this.value)" onchange="updatePreview(this)"></label><label>預計每次購買<input type="number" value="${x.planned}" oninput="setValue('packs','${x.id}','planned',num(this.value))"></label><label>重置<select onchange="setValue('packs','${x.id}','daily',this.value==='1')"><option value="1"${x.daily?' selected':''}>每日</option><option value="0"${!x.daily?' selected':''}>活動一次</option></select></label></div><label class="toggle"><input type="checkbox"${x.on?' checked':''} onchange="setValue('packs','${x.id}','on',this.checked)">納入模擬</label><div class="preview">${preview(x.contents)}</div></div>`).join(''):'<p class="small">尚無禮包。</p>';
$('#progressList').innerHTML=db.progress.length?db.progress.map((x,i)=>`<div class="item"><div class="head"><b>階段 ${i+1}</b>${buttons('progress',x.id)}</div><div class="row"><label>階數<input type="number" value="${x.tier}" oninput="setValue('progress','${x.id}','tier',num(this.value))"></label><label>門檻<input type="number" value="${x.threshold}" oninput="setValue('progress','${x.id}','threshold',num(this.value))"></label><label>獎勵<input value="${esc(x.rewards)}" oninput="setValue('progress','${x.id}','rewards',this.value)" onchange="updatePreview(this)"></label></div><label class="toggle"><input type="checkbox"${x.on?' checked':''} onchange="setValue('progress','${x.id}','on',this.checked)">啟用</label><div class="preview">${preview(x.rewards)}</div></div>`).join(''):'<p class="small">尚無階段。</p>';
$('#exchangeList').innerHTML=db.exchange.length?db.exchange.map((x,i)=>`<div class="item"><div class="head"><b>${esc(x.kind)}兌換 ${i+1}</b>${buttons('exchange',x.id)}</div><div class="row"><label>類型<select onchange="setValue('exchange','${x.id}','kind',this.value)"><option${x.kind==='普通'?' selected':''}>普通</option><option${x.kind==='高級'?' selected':''}>高級</option></select></label><label>品項<input value="${esc(x.name)}" oninput="setValue('exchange','${x.id}','name',this.value)"></label><label>消耗貨幣<input value="${esc(x.costResource)}" oninput="setValue('exchange','${x.id}','costResource',this.value)"></label><label>單次消耗<input type="number" value="${x.cost}" oninput="setValue('exchange','${x.id}','cost',num(this.value))"></label></div><div class="row"><label>限購<input type="number" value="${x.limit}" oninput="setValue('exchange','${x.id}','limit',num(this.value))"></label><label>取得內容<input value="${esc(x.rewards)}" oninput="setValue('exchange','${x.id}','rewards',this.value)" onchange="updatePreview(this)"></label></div><div class="preview">${preview(x.rewards)}</div></div>`).join(''):'<p class="small">尚無兌換品。</p>'}
function updatePreview(input){const box=input.closest('.item').querySelector('.preview');box.innerHTML=preview(input.value);box.classList.toggle('bad',parseItems(input.value).some(x=>!x.ok))}
function aggregate(o,k,v){if(k)o[k]=(o[k]||0)+num(v)}function table(o){let a=Object.entries(o).filter(x=>x[1]);return a.length?`<table><tr><th>資源</th><th>數量</th></tr>${a.map(x=>`<tr><td>${esc(x[0])}</td><td>${x[1].toLocaleString()}</td></tr>`).join('')}</table>`:'<p class="small">沒有資料。</p>'}
function calculateSummary(){let days=Math.max(1,num($('#simDays').value)),token=$('#tokenName').value,premium=$('#premiumName').value,inc={},cost={},taskToken=num($('#dailyTaskToken').value)*days,packToken=0;aggregate(inc,token,taskToken);db.packs.filter(x=>x.on).forEach(x=>{let m=x.daily?days:1,q=Math.min(num(x.planned),num(x.limit))*m;aggregate(cost,x.priceResource,num(x.price)*q);parseItems(x.contents).filter(a=>a.ok).forEach(a=>{aggregate(inc,a.name,a.amount*q);if(a.name===token)packToken+=a.amount*q})});aggregate(inc,token,num($('#manualToken').value));aggregate(inc,premium,num($('#manualPremium').value));let pts=(inc[token]||0)*num($('#pointsPerToken').value)+(inc[premium]||0)*num($('#pointsPerPremium').value)+num($('#simLaps').value)*num($('#pointsPerLap').value);$('#sTask').textContent=taskToken;$('#sPack').textContent=packToken;$('#sPremium').textContent=inc[premium]||0;$('#sPoints').textContent=pts;$('#income').innerHTML=table(inc);$('#cost').innerHTML=table(cost);$('#tierResult').innerHTML=db.progress.filter(x=>x.on).sort((a,b)=>a.tier-b.tier).map(x=>`<div class="item"><b>第 ${x.tier} 階｜${x.threshold} 分</b><span class="${pts>=x.threshold?'ok':'warn'}" style="float:right">${pts>=x.threshold?'可達成':'尚差 '+(x.threshold-pts)}</span><div class="small">${esc(x.rewards)}</div></div>`).join('')||'<p class="small">尚無階段。</p>'}
function saveAll(){localStorage.setItem('activitySimV2',JSON.stringify({version:2,settings:settings(),db}));alert('已儲存。')}function exportJSON(){let b=new Blob([JSON.stringify({version:2,settings:settings(),db},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=($('#eventName').value||'活動')+'_v2.json';a.click();URL.revokeObjectURL(a.href)}
$('#file').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let o=JSON.parse(r.result);db=o.db||db;if(!db.tiles||db.tiles.length!==30)db.tiles=defaultTiles();applySettings(o.settings);renderLists();selectTile(0);applyRunSettings();calculateSummary()}catch(err){alert('格式錯誤，無法匯入。')}};r.readAsText(f);e.target.value=''};
function loadExample(){applySettings({eventName:'夏日環遊',eventDays:7,currentDay:1,tokenName:'骰子',dailyTaskToken:11,premiumName:'火龍果汁',normalName:'奇異果汁',paidName:'寶石',pointsPerToken:2,pointsPerPremium:0,pointsPerLap:10,simDays:7,ownedDice:37,startPosition:0,diceCost:1,lapReward:''});db={tiles:defaultTiles(),packs:[{id:uid(),name:'廣告骰子禮包',priceResource:'廣告',price:1,limit:1,planned:1,daily:true,contents:'骰子:2',on:true},{id:uid(),name:'寶石骰子禮包',priceResource:'寶石',price:1000,limit:7,planned:0,daily:true,contents:'骰子:10',on:true}],progress:[90,180,300,450,650].map((v,i)=>({id:uid(),tier:i+1,threshold:v,rewards:'火龍果汁隨機箱:1, 寶石:'+(50+i*50),on:true})),exchange:[{id:uid(),kind:'高級',name:'覺醒核心自選箱',costResource:'火龍果汁',cost:25,limit:5,rewards:'覺醒核心自選箱:1',on:true},{id:uid(),kind:'普通',name:'一般資源箱',costResource:'奇異果汁',cost:5,limit:20,rewards:'一般資源箱:1',on:true}]};renderLists();selectTile(0);applyRunSettings();calculateSummary()}
function resetAll(){if(confirm('確定全部重設？')){localStorage.removeItem('activitySimV2');location.reload()}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#'+b.dataset.p).classList.add('on');if(b.dataset.p==='summary')calculateSummary();if(b.dataset.p==='boardPanel')renderBoard()});
$('#eventName').addEventListener('change',renderBoard);
try{let o=JSON.parse(localStorage.getItem('activitySimV2'));if(o){db=o.db||db;if(!db.tiles||db.tiles.length!==30)db.tiles=defaultTiles();applySettings(o.settings);renderLists();selectTile(0);applyRunSettings();calculateSummary()}else loadExample()}catch(e){loadExample()}
</script></body></html>
