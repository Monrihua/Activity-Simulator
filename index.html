<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>夏日環遊大富翁</title>
<style>
  :root{
    --bg1:#62d7f0;
    --bg2:#ffe3a7;
    --ink:#3d302d;
    --panel:#fff9e9;
    --pink:#ff76aa;
    --blue:#4fc7e8;
    --yellow:#ffd66e;
    --purple:#a86ee8;
    --shadow:0 8px 0 rgba(102,69,45,.22);
  }

  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:"Arial","Microsoft JhengHei",sans-serif;color:var(--ink)}
  body{
    background:
      radial-gradient(circle at 12% 18%,rgba(255,255,255,.75) 0 16px,transparent 17px),
      radial-gradient(circle at 80% 12%,rgba(255,255,255,.55) 0 22px,transparent 23px),
      linear-gradient(var(--bg1) 0 29%, var(--bg2) 29% 100%);
    display:flex;
    justify-content:center;
  }

  .game{
    width:min(100%,760px);
    min-height:100vh;
    padding:14px 12px calc(20px + env(safe-area-inset-bottom));
  }

  .title-card{
    background:#8d552f;
    color:#fff;
    border:5px solid #5f351f;
    border-radius:20px;
    padding:10px 16px;
    text-align:center;
    box-shadow:var(--shadow);
    margin-bottom:12px;
  }
  .title-card h1{margin:0;font-size:clamp(26px,7vw,44px);letter-spacing:2px}
  .title-card p{margin:5px 0 0;font-weight:700;color:#ffeca2}

  .status{
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
    align-items:center;
    background:var(--panel);
    border:4px solid #6a4b3c;
    border-radius:20px;
    padding:10px 12px;
    box-shadow:var(--shadow);
    margin-bottom:16px;
  }

  .progress-wrap{min-width:0}
  .progress-label{
    display:flex;
    justify-content:space-between;
    font-weight:900;
    font-size:14px;
    margin-bottom:6px;
  }
  .progress{
    height:22px;
    border:3px solid #4c3a34;
    border-radius:999px;
    overflow:hidden;
    background:#d9e7e8;
  }
  .progress > div{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#ffd966,#ff9c66);
    transition:width .45s ease;
  }
  .coins{
    white-space:nowrap;
    background:#3b3030;
    color:white;
    border-radius:999px;
    padding:8px 13px;
    font-weight:900;
    border:3px solid #1e1818;
  }

  .board-shell{
    background:rgba(255,255,255,.25);
    border:4px solid rgba(255,255,255,.65);
    border-radius:28px;
    padding:10px;
    box-shadow:0 16px 30px rgba(73,63,50,.18);
  }

  .board{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    grid-template-rows:repeat(7,1fr);
    gap:5px;
    aspect-ratio:1/1;
    position:relative;
  }

  .tile{
    border:3px solid #684632;
    border-radius:12px;
    box-shadow:0 4px 0 #7a533d;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-weight:900;
    font-size:clamp(10px,2.5vw,16px);
    min-width:0;
    position:relative;
    user-select:none;
    transform:translateZ(0);
  }
  .tile .icon{font-size:clamp(18px,4.2vw,34px);line-height:1}
  .tile .reward{font-size:clamp(9px,2vw,14px);margin-top:3px}
  .tile.gold{background:#ffdd7e}
  .tile.gem{background:#f4a6ff}
  .tile.energy{background:#8ee6ff}
  .tile.mystery{background:#c8a7ff}
  .tile.start{background:#fff4d1}
  .tile.active{animation:pulse .7s ease infinite alternate}
  @keyframes pulse{
    from{transform:translateY(0);filter:brightness(1)}
    to{transform:translateY(-4px);filter:brightness(1.15)}
  }

  .center{
    grid-column:2/7;
    grid-row:2/7;
    border:5px solid #6b4935;
    border-radius:24px;
    background:
      linear-gradient(45deg,rgba(255,255,255,.18) 25%,transparent 25% 50%,rgba(255,255,255,.18) 50% 75%,transparent 75%),
      #55c9e8;
    background-size:42px 42px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    padding:10px;
    box-shadow:inset 0 0 0 8px rgba(255,255,255,.35);
  }
  .center .pool{
    width:54%;
    aspect-ratio:1.5/1;
    border-radius:45%;
    background:#9be8f6;
    border:5px solid #fff;
    box-shadow:inset 0 -10px 0 rgba(38,157,192,.22);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(34px,9vw,72px);
  }
  .center h2{margin:10px 0 3px;font-size:clamp(18px,4.8vw,32px)}
  .center p{margin:0;font-weight:800;font-size:clamp(11px,2.8vw,16px)}

  .player{
    position:absolute;
    z-index:20;
    width:clamp(30px,7vw,52px);
    height:clamp(30px,7vw,52px);
    border-radius:50%;
    background:#ff826e;
    border:4px solid white;
    box-shadow:0 4px 0 rgba(68,43,35,.35);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(17px,4vw,30px);
    transition:left .24s ease, top .24s ease;
    pointer-events:none;
  }

  .controls{
    display:grid;
    grid-template-columns:1fr minmax(130px,220px);
    gap:12px;
    margin-top:16px;
    align-items:stretch;
  }
  .inventory, .roll-panel{
    background:var(--panel);
    border:4px solid #67483a;
    border-radius:22px;
    box-shadow:var(--shadow);
    padding:12px;
  }
  .inventory h3,.roll-panel h3{margin:0 0 8px}
  .items{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
  }
  .item{
    background:white;
    border:3px solid #e0b97b;
    border-radius:12px;
    padding:7px 4px;
    text-align:center;
    font-weight:900;
  }
  .item b{display:block;font-size:20px}

  .roll-panel{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:#ff91b8;
  }
  .dice{
    width:76px;height:76px;
    border-radius:18px;
    background:#fff8dc;
    border:4px solid #3f3028;
    display:flex;align-items:center;justify-content:center;
    font-size:46px;font-weight:900;
    box-shadow:0 7px 0 rgba(75,47,38,.25);
    margin-bottom:10px;
  }
  button{
    width:100%;
    border:none;
    border-radius:999px;
    padding:13px 16px;
    font-size:20px;
    font-weight:900;
    cursor:pointer;
    color:#4b332d;
    background:#ffd66e;
    border:4px solid #5b4036;
    box-shadow:0 6px 0 #8d5e40;
    touch-action:manipulation;
  }
  button:active{transform:translateY(4px);box-shadow:0 2px 0 #8d5e40}
  button:disabled{opacity:.55;cursor:not-allowed}

  .log{
    margin-top:14px;
    background:rgba(255,255,255,.82);
    border:3px solid #6b4a3d;
    border-radius:16px;
    padding:10px 12px;
    font-weight:800;
    min-height:48px;
  }

  .toast{
    position:fixed;
    left:50%;
    top:18%;
    transform:translate(-50%,-20px) scale(.9);
    background:#342828;
    color:white;
    border:4px solid white;
    border-radius:18px;
    padding:13px 20px;
    font-size:22px;
    font-weight:900;
    opacity:0;
    pointer-events:none;
    z-index:100;
    transition:.25s ease;
    text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,0) scale(1)}

  @media (max-width:520px){
    .game{padding-left:7px;padding-right:7px}
    .board{gap:3px}
    .tile{border-width:2px;border-radius:8px;box-shadow:0 3px 0 #7a533d}
    .controls{grid-template-columns:1fr 145px}
    .items{grid-template-columns:1fr 1fr}
    .item:last-child{grid-column:1/3}
  }
</style>
</head>
<body>
<div class="game">
  <header class="title-card">
    <h1>🏖️ 夏日環遊</h1>
    <p>擲骰子前進，踩到什麼就拿什麼！</p>
  </header>

  <section class="status">
    <div class="progress-wrap">
      <div class="progress-label">
        <span>環遊進度</span>
        <span id="progressText">0 / 100</span>
      </div>
      <div class="progress"><div id="progressBar"></div></div>
    </div>
    <div class="coins">🪙 <span id="coinTop">0</span></div>
  </section>

  <div class="board-shell">
    <div class="board" id="board">
      <div class="center">
        <div class="pool">🦦</div>
        <h2>夏日派對</h2>
        <p>每走完一圈可獲得額外 10 金幣</p>
      </div>
      <div class="player" id="player">🐹</div>
    </div>
  </div>

  <section class="controls">
    <div class="inventory">
      <h3>🎒 我的資源</h3>
      <div class="items">
        <div class="item">🪙 金幣<b id="coins">0</b></div>
        <div class="item">💎 寶石<b id="gems">0</b></div>
        <div class="item">⚡ 能量<b id="energy">0</b></div>
      </div>
    </div>
    <div class="roll-panel">
      <div class="dice" id="dice">🎲</div>
      <button id="rollBtn">擲骰子</button>
    </div>
  </section>

  <div class="log" id="log">準備出發！按下「擲骰子」。</div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  const board = document.getElementById('board');
  const player = document.getElementById('player');
  const rollBtn = document.getElementById('rollBtn');
  const dice = document.getElementById('dice');
  const log = document.getElementById('log');
  const toast = document.getElementById('toast');

  const state = {
    position: 0,
    coins: 0,
    gems: 0,
    energy: 0,
    progress: 0,
    rolling: false
  };

  const rewards = [
    {type:'start', icon:'🏁', text:'起點', amount:0},
    {type:'gold', icon:'🪙', text:'金幣', amount:5},
    {type:'gem', icon:'💎', text:'寶石', amount:2},
    {type:'energy', icon:'⚡', text:'能量', amount:3},
    {type:'gold', icon:'🪙', text:'金幣', amount:8},
    {type:'mystery', icon:'🎁', text:'驚喜', amount:0},
    {type:'gem', icon:'💎', text:'寶石', amount:3},
    {type:'gold', icon:'🪙', text:'金幣', amount:4},
    {type:'energy', icon:'⚡', text:'能量', amount:5},
    {type:'gem', icon:'💎', text:'寶石', amount:2},
    {type:'gold', icon:'🪙', text:'金幣', amount:10},
    {type:'mystery', icon:'🎁', text:'驚喜', amount:0},
    {type:'energy', icon:'⚡', text:'能量', amount:4},
    {type:'gold', icon:'🪙', text:'金幣', amount:6},
    {type:'gem', icon:'💎', text:'寶石', amount:4},
    {type:'energy', icon:'⚡', text:'能量', amount:2},
    {type:'gold', icon:'🪙', text:'金幣', amount:7},
    {type:'mystery', icon:'🎁', text:'驚喜', amount:0},
    {type:'gem', icon:'💎', text:'寶石', amount:5},
    {type:'gold', icon:'🪙', text:'金幣', amount:9},
    {type:'energy', icon:'⚡', text:'能量', amount:3},
    {type:'gem', icon:'💎', text:'寶石', amount:3},
    {type:'gold', icon:'🪙', text:'金幣', amount:12},
    {type:'mystery', icon:'🎁', text:'驚喜', amount:0}
  ];

  // 7x7 外圈，共 24 格，順時針排列
  const coords = [];
  for(let c=0;c<7;c++) coords.push([1,c+1]);          // 上
  for(let r=1;r<7;r++) coords.push([r+1,7]);          // 右
  for(let c=5;c>=0;c--) coords.push([7,c+1]);          // 下
  for(let r=5;r>=1;r--) coords.push([r+1,1]);          // 左

  const tiles = rewards.map((reward, index) => {
    const tile = document.createElement('div');
    tile.className = `tile ${reward.type}`;
    tile.style.gridRow = coords[index][0];
    tile.style.gridColumn = coords[index][1];
    tile.innerHTML = `
      <span class="icon">${reward.icon}</span>
      <span class="reward">${reward.type === 'start' ? reward.text : reward.type === 'mystery' ? reward.text : '×' + reward.amount}</span>
    `;
    board.appendChild(tile);
    return tile;
  });

  function tileCenter(index){
    const boardRect = board.getBoundingClientRect();
    const tileRect = tiles[index].getBoundingClientRect();
    return {
      left: tileRect.left - boardRect.left + tileRect.width/2 - player.offsetWidth/2,
      top: tileRect.top - boardRect.top + tileRect.height/2 - player.offsetHeight/2
    };
  }

  function placePlayer(index){
    const p = tileCenter(index);
    player.style.left = `${p.left}px`;
    player.style.top = `${p.top}px`;
    tiles.forEach(t => t.classList.remove('active'));
    tiles[index].classList.add('active');
  }

  function updateUI(){
    document.getElementById('coins').textContent = state.coins;
    document.getElementById('coinTop').textContent = state.coins;
    document.getElementById('gems').textContent = state.gems;
    document.getElementById('energy').textContent = state.energy;
    document.getElementById('progressText').textContent = `${state.progress} / 100`;
    document.getElementById('progressBar').style.width = `${Math.min(state.progress,100)}%`;
  }

  function showToast(text){
    toast.textContent = text;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1300);
  }

  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

  async function move(steps){
    for(let i=0;i<steps;i++){
      const old = state.position;
      state.position = (state.position + 1) % rewards.length;
      if(state.position === 0 && old === rewards.length - 1){
        state.coins += 10;
        state.progress = Math.min(100, state.progress + 10);
        updateUI();
        showToast('完成一圈！🪙 +10');
      }
      placePlayer(state.position);
      await wait(250);
    }
  }

  function grantReward(){
    const reward = rewards[state.position];
    let message = '';

    if(reward.type === 'gold'){
      state.coins += reward.amount;
      message = `獲得金幣 ${reward.amount} 枚！`;
    } else if(reward.type === 'gem'){
      state.gems += reward.amount;
      message = `獲得寶石 ${reward.amount} 顆！`;
    } else if(reward.type === 'energy'){
      state.energy += reward.amount;
      message = `獲得能量 ${reward.amount} 點！`;
    } else if(reward.type === 'mystery'){
      const options = [
        {key:'coins', amount:15, label:'金幣 15 枚', icon:'🪙'},
        {key:'gems', amount:6, label:'寶石 6 顆', icon:'💎'},
        {key:'energy', amount:8, label:'能量 8 點', icon:'⚡'}
      ];
      const pick = options[Math.floor(Math.random()*options.length)];
      state[pick.key] += pick.amount;
      message = `驚喜禮盒：獲得${pick.label}！`;
      showToast(`${pick.icon} ${pick.label}`);
    } else {
      message = '回到起點，繼續旅行！';
    }

    state.progress = Math.min(100, state.progress + 2);
    updateUI();
    log.textContent = message;
    if(reward.type !== 'mystery') showToast(message);

    if(state.progress >= 100){
      setTimeout(() => {
        showToast('🎉 完成夏日環遊！');
        log.textContent = '恭喜完成 100 點環遊進度！你仍可繼續遊玩。';
      }, 600);
    }
  }

  async function roll(){
    if(state.rolling) return;
    state.rolling = true;
    rollBtn.disabled = true;

    let result = 1;
    for(let i=0;i<8;i++){
      result = Math.floor(Math.random()*6)+1;
      dice.textContent = result;
      await wait(70 + i*18);
    }

    log.textContent = `擲出 ${result} 點，前進 ${result} 格！`;
    await move(result);
    grantReward();

    state.rolling = false;
    rollBtn.disabled = false;
  }

  rollBtn.addEventListener('click', roll);
  window.addEventListener('resize', () => placePlayer(state.position));

  updateUI();
  requestAnimationFrame(() => placePlayer(0));
})();
</script>
</body>
</html>
