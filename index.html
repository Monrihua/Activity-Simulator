<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>換皮活動模擬器</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft JhengHei",sans-serif;background:linear-gradient(#70d5eb 0 180px,#f7dda0 180px);color:#302925}
.app{max-width:1100px;margin:auto;padding:12px 12px 40px}.hero,.card{border:4px solid #65483a;border-radius:20px;box-shadow:0 7px 0 #7b5b4933}
.hero{background:#8d542f;color:#fff;padding:16px}.hero h1{margin:0}.hero p{color:#ffe8a1;font-weight:bold}
.tools,.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tabs{overflow:auto;flex-wrap:nowrap}
button,.file{padding:9px 13px;border:3px solid #493831;border-radius:12px;background:#ffd66d;font-weight:900;cursor:pointer}.danger{background:#ffb0b0}.blue{background:#c8eff9}.green{background:#b9e963}
input[type=file]{display:none}.tab{white-space:nowrap}.tab.on{background:#ef6aa7;color:#fff}
.panel{display:none}.panel.on{display:block}.card{background:#fff9eb;padding:14px;margin:12px 0}.card h2{margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:430px){.grid{grid-template-columns:1fr}}
label{font-size:13px;font-weight:bold}input,select,textarea{width:100%;margin-top:5px;padding:9px;border:2px solid #a38676;border-radius:9px;font-size:15px}
.item{background:#fff;border:3px solid #a7836d;border-radius:14px;padding:10px;margin-top:10px}.head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;margin-top:8px}@media(max-width:750px){.row{grid-template-columns:1fr 1fr}}
.preview{background:#edf9fc;border:2px dashed #65a8b8;border-radius:9px;padding:8px;margin-top:8px;font-size:13px;line-height:1.55}.bad{background:#fff0f0;border-color:#d77878}
.small{font-size:12px;color:#6e625c}.toggle{display:flex;gap:6px;align-items:center;margin-top:8px}.toggle input{width:auto;margin:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}}.stat{background:#fff;border:3px solid #987664;border-radius:12px;padding:9px;text-align:center}.stat b{display:block;font-size:25px}
table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}th{background:#efdfc8}.ok{color:#27863a;font-weight:bold}.warn{color:#b33b42;font-weight:bold}
</style>
</head>
<body><div class="app">
<header class="hero"><h1>🏝️ 換皮活動模擬器</h1><p>任務、禮包、進度與兌換內容都能自由新增、刪除、匯入與匯出。</p></header>
<div class="tools">
<button class="green" onclick="save()">💾 儲存</button><button class="blue" onclick="download()">⬇ 匯出 JSON</button>
<label class="file">⬆ 匯入 JSON<input id="file" type="file" accept=".json"></label>
<button onclick="example()">載入大富翁範例</button><button class="danger" onclick="resetAll()">全部重設</button>
</div>
<div class="tabs">
<button class="tab on" data-p="basic">活動設定</button><button class="tab" data-p="tasks">活動委託</button><button class="tab" data-p="packs">禮包</button><button class="tab" data-p="progress">進度獎勵</button><button class="tab" data-p="exchange">兌換商店</button><button class="tab" data-p="summary">模擬總覽</button>
</div>

<section id="basic" class="panel on"><div class="card"><h2>基本資料</h2><div class="grid">
<label>活動名稱<input id="eventName" value="夏日環遊"></label><label>活動天數<input id="eventDays" type="number" value="7"></label>
<label>目前第幾天<input id="currentDay" type="number" value="1"></label><label>每日重置時間<input id="resetTime" type="time" value="00:00"></label>
<label>玩法代幣名稱<input id="tokenName" value="骰子"></label><label>高級兌換幣名稱<input id="premiumName" value="火龍果汁"></label>
<label>普通兌換幣名稱<input id="normalName" value="奇異果汁"></label><label>付費貨幣名稱<input id="paidName" value="寶石"></label>
</div></div>
<div class="card"><h2>積分規則</h2><div class="grid">
<label>每獲得 1 個玩法代幣積分<input id="pointsPerToken" type="number" value="2"></label>
<label>每獲得 1 個高級兌換幣積分<input id="pointsPerPremium" type="number" value="0"></label>
<label>每完成 1 圈積分<input id="pointsPerLap" type="number" value="10"></label>
<label>每日進度重置<select id="dailyReset"><option value="yes">是</option><option value="no">否</option></select></label>
</div><p class="small">內容物格式：骰子:10, 寶石:600, 寶箱:1。也支援全形冒號與頓號。</p></div></section>

<section id="tasks" class="panel"><div class="card"><h2>活動委託</h2><div class="actions"><button onclick="add('tasks')">＋新增任務</button><button class="danger" onclick="clearList('tasks')">清空全部</button></div><div id="taskList"></div></div></section>
<section id="packs" class="panel"><div class="card"><h2>禮包</h2><div class="actions"><button onclick="add('packs')">＋新增禮包</button><button class="danger" onclick="clearList('packs')">清空全部</button></div><div id="packList"></div></div></section>
<section id="progress" class="panel"><div class="card"><h2>進度獎勵</h2><div class="actions"><button onclick="add('progress')">＋新增階段</button><button class="danger" onclick="clearList('progress')">清空全部</button></div><div id="progressList"></div></div></section>
<section id="exchange" class="panel"><div class="card"><h2>兌換商店</h2><div class="actions"><button onclick="add('exchange','普通')">＋普通兌換</button><button onclick="add('exchange','高級')">＋高級兌換</button><button class="danger" onclick="clearList('exchange')">清空全部</button></div><div id="exchangeList"></div></div></section>

<section id="summary" class="panel">
<div class="card"><h2>模擬條件</h2><div class="grid">
<label>模擬天數<input id="simDays" type="number" value="7"></label><label>預計圈數<input id="simLaps" type="number" value="0"></label>
<label>額外獲得玩法代幣<input id="manualToken" type="number" value="0"></label><label>額外獲得高級兌換幣<input id="manualPremium" type="number" value="0"></label>
</div><button style="margin-top:10px" onclick="calc()">重新計算</button></div>
<div class="card"><h2>結果</h2><div class="stats">
<div class="stat">任務玩法代幣<b id="sTask">0</b></div><div class="stat">禮包玩法代幣<b id="sPack">0</b></div><div class="stat">高級兌換幣<b id="sPremium">0</b></div><div class="stat">預估積分<b id="sPoints">0</b></div>
</div></div>
<div class="card"><h2>資源收入</h2><div id="income"></div></div><div class="card"><h2>禮包花費</h2><div id="cost"></div></div><div class="card"><h2>階段判定</h2><div id="tierResult"></div></div>
</section>
</div>
<script>
const $=s=>document.querySelector(s), uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let db={tasks:[],packs:[],progress:[],exchange:[]};
const n=v=>Number(v)||0, esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function parse(t){if(!String(t||'').trim())return[];return String(t).split(/[,，、;\n]+/).map(x=>x.trim()).filter(Boolean).map(x=>{let m=x.match(/^(.+?)\s*[:：xX×]\s*(-?\d+(?:\.\d+)?)$/);return m?{name:m[1].trim(),amount:n(m[2]),ok:true}:{name:x,amount:0,ok:false}})}
function preview(t){const a=parse(t);if(!a.length)return '<span class="warn">尚未輸入</span>';return a.map(x=>(x.ok?'✓ ':'✕ ')+esc(x.name)+(x.ok?' × '+x.amount:'（請用 名稱:數量）')).join('<br>')}
function add(type,kind){if(type==='tasks')db.tasks.push({id:uid(),name:'新任務',condition:'完成指定內容',reward:'骰子:3',daily:true,on:true});
if(type==='packs')db.packs.push({id:uid(),name:'新禮包',priceResource:$('#paidName').value,price:1000,limit:1,planned:0,daily:true,contents:'骰子:10',on:true});
if(type==='progress')db.progress.push({id:uid(),tier:db.progress.length+1,threshold:90,rewards:'寶箱:1, 寶石:50',on:true});
if(type==='exchange')db.exchange.push({id:uid(),kind:kind||'普通',name:'兌換品',costResource:kind==='高級'?$('#premiumName').value:$('#normalName').value,cost:1,limit:1,rewards:'道具:1',on:true});render()}
function del(type,id){db[type]=db[type].filter(x=>x.id!==id);render()}function dup(type,id){let x=db[type].find(a=>a.id===id);if(x){x=JSON.parse(JSON.stringify(x));x.id=uid();x.name+='（複製）';db[type].push(x);render()}}
function clearList(type){if(confirm('確定清空？')){db[type]=[];render()}}function setv(type,id,k,v){let x=db[type].find(a=>a.id===id);if(x)x[k]=v}
function btns(t,id){return `<div><button onclick="dup('${t}','${id}')">複製</button> <button class="danger" onclick="del('${t}','${id}')">刪除</button></div>`}
function render(){
$('#taskList').innerHTML=db.tasks.length?db.tasks.map((x,i)=>`<div class="item"><div class="head"><b>任務 ${i+1}</b>${btns('tasks',x.id)}</div><div class="row"><label>名稱<input value="${esc(x.name)}" oninput="setv('tasks','${x.id}','name',this.value)"></label><label>條件<input value="${esc(x.condition)}" oninput="setv('tasks','${x.id}','condition',this.value)"></label><label>獎勵<input value="${esc(x.reward)}" oninput="setv('tasks','${x.id}','reward',this.value);render()"></label><label>重置<select onchange="setv('tasks','${x.id}','daily',this.value==='1')"><option value="1"${x.daily?' selected':''}>每日</option><option value="0"${!x.daily?' selected':''}>活動一次</option></select></label></div><label class="toggle"><input type="checkbox"${x.on?' checked':''} onchange="setv('tasks','${x.id}','on',this.checked)">納入模擬</label><div class="preview ${parse(x.reward).some(a=>!a.ok)?'bad':''}">${preview(x.reward)}</div></div>`).join(''):'<p class="small">尚無任務。</p>';
$('#packList').innerHTML=db.packs.length?db.packs.map((x,i)=>`<div class="item"><div class="head"><b>禮包 ${i+1}</b>${btns('packs',x.id)}</div><div class="row"><label>名稱<input value="${esc(x.name)}" oninput="setv('packs','${x.id}','name',this.value)"></label><label>價格貨幣<input value="${esc(x.priceResource)}" oninput="setv('packs','${x.id}','priceResource',this.value)"></label><label>單價<input type="number" value="${x.price}" oninput="setv('packs','${x.id}','price',n(this.value))"></label><label>每日/活動限購<input type="number" value="${x.limit}" oninput="setv('packs','${x.id}','limit',n(this.value))"></label></div><div class="row"><label>內容物<input value="${esc(x.contents)}" oninput="setv('packs','${x.id}','contents',this.value);render()"></label><label>預計每次購買<input type="number" value="${x.planned}" oninput="setv('packs','${x.id}','planned',n(this.value))"></label><label>重置<select onchange="setv('packs','${x.id}','daily',this.value==='1')"><option value="1"${x.daily?' selected':''}>每日</option><option value="0"${!x.daily?' selected':''}>活動一次</option></select></label></div><label class="toggle"><input type="checkbox"${x.on?' checked':''} onchange="setv('packs','${x.id}','on',this.checked)">納入模擬</label><div class="preview ${parse(x.contents).some(a=>!a.ok)?'bad':''}">${preview(x.contents)}</div></div>`).join(''):'<p class="small">尚無禮包。</p>';
$('#progressList').innerHTML=db.progress.length?db.progress.map((x,i)=>`<div class="item"><div class="head"><b>階段 ${i+1}</b>${btns('progress',x.id)}</div><div class="row"><label>階數<input type="number" value="${x.tier}" oninput="setv('progress','${x.id}','tier',n(this.value))"></label><label>積分門檻<input type="number" value="${x.threshold}" oninput="setv('progress','${x.id}','threshold',n(this.value))"></label><label>獎勵<input value="${esc(x.rewards)}" oninput="setv('progress','${x.id}','rewards',this.value);render()"></label></div><label class="toggle"><input type="checkbox"${x.on?' checked':''} onchange="setv('progress','${x.id}','on',this.checked)">啟用</label><div class="preview">${preview(x.rewards)}</div></div>`).join(''):'<p class="small">尚無階段。</p>';
$('#exchangeList').innerHTML=db.exchange.length?db.exchange.map((x,i)=>`<div class="item"><div class="head"><b>${esc(x.kind)}兌換 ${i+1}</b>${btns('exchange',x.id)}</div><div class="row"><label>類型<select onchange="setv('exchange','${x.id}','kind',this.value)"><option${x.kind==='普通'?' selected':''}>普通</option><option${x.kind==='高級'?' selected':''}>高級</option></select></label><label>品項<input value="${esc(x.name)}" oninput="setv('exchange','${x.id}','name',this.value)"></label><label>消耗貨幣<input value="${esc(x.costResource)}" oninput="setv('exchange','${x.id}','costResource',this.value)"></label><label>單次消耗<input type="number" value="${x.cost}" oninput="setv('exchange','${x.id}','cost',n(this.value))"></label></div><div class="row"><label>限購<input type="number" value="${x.limit}" oninput="setv('exchange','${x.id}','limit',n(this.value))"></label><label>取得內容<input value="${esc(x.rewards)}" oninput="setv('exchange','${x.id}','rewards',this.value);render()"></label></div><div class="preview">${preview(x.rewards)}</div></div>`).join(''):'<p class="small">尚無兌換品。</p>'}
function settings(){let ids=['eventName','eventDays','currentDay','resetTime','tokenName','premiumName','normalName','paidName','pointsPerToken','pointsPerPremium','pointsPerLap','dailyReset','simDays','simLaps','manualToken','manualPremium'],o={};ids.forEach(id=>o[id]=$('#'+id).value);return o}
function apply(o){Object.entries(o||{}).forEach(([k,v])=>{let e=$('#'+k);if(e)e.value=v})}
function save(){localStorage.setItem('activitySim',JSON.stringify({settings:settings(),db}));alert('已儲存。')}
function download(){let b=new Blob([JSON.stringify({version:1,settings:settings(),db},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=($('#eventName').value||'活動')+'_設定.json';a.click()}
$('#file').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let o=JSON.parse(r.result);db=o.db;apply(o.settings);render();calc()}catch{alert('格式錯誤')}};r.readAsText(f)}
function ag(o,k,v){if(k)o[k]=(o[k]||0)+n(v)}function table(o){let a=Object.entries(o).filter(x=>x[1]);return a.length?`<table><tr><th>資源</th><th>數量</th></tr>${a.map(x=>`<tr><td>${esc(x[0])}</td><td>${x[1].toLocaleString()}</td></tr>`).join('')}</table>`:'<p class="small">沒有資料。</p>'}
function calc(){let days=Math.max(1,n($('#simDays').value)),token=$('#tokenName').value,premium=$('#premiumName').value,inc={},cost={},taskToken=0,packToken=0;
db.tasks.filter(x=>x.on).forEach(x=>{let m=x.daily?days:1;parse(x.reward).filter(a=>a.ok).forEach(a=>{ag(inc,a.name,a.amount*m);if(a.name===token)taskToken+=a.amount*m})});
db.packs.filter(x=>x.on).forEach(x=>{let m=x.daily?days:1,q=Math.min(n(x.planned),n(x.limit))*m;ag(cost,x.priceResource,n(x.price)*q);parse(x.contents).filter(a=>a.ok).forEach(a=>{ag(inc,a.name,a.amount*q);if(a.name===token)packToken+=a.amount*q})});
ag(inc,token,n($('#manualToken').value));ag(inc,premium,n($('#manualPremium').value));let pts=(inc[token]||0)*n($('#pointsPerToken').value)+(inc[premium]||0)*n($('#pointsPerPremium').value)+n($('#simLaps').value)*n($('#pointsPerLap').value);
$('#sTask').textContent=taskToken;$('#sPack').textContent=packToken;$('#sPremium').textContent=inc[premium]||0;$('#sPoints').textContent=pts;$('#income').innerHTML=table(inc);$('#cost').innerHTML=table(cost);
$('#tierResult').innerHTML=db.progress.filter(x=>x.on).sort((a,b)=>a.tier-b.tier).map(x=>`<div class="item"><b>第 ${x.tier} 階｜${x.threshold} 分</b><span class="${pts>=x.threshold?'ok':'warn'}" style="float:right">${pts>=x.threshold?'可達成':'尚差 '+(x.threshold-pts)}</span><div class="small">${esc(x.rewards)}</div></div>`).join('')||'<p class="small">尚無階段。</p>'}
function example(){apply({eventName:'夏日環遊',eventDays:7,tokenName:'骰子',premiumName:'火龍果汁',normalName:'奇異果汁',paidName:'寶石',pointsPerToken:2,pointsPerLap:10,simDays:7});db={tasks:[
{id:uid(),name:'登入遊戲1次',condition:'1/1',reward:'骰子:3',daily:true,on:true},{id:uid(),name:'參加2次挑戰之塔或地牢',condition:'0/2',reward:'骰子:2',daily:true,on:true},{id:uid(),name:'挑戰3次競技場',condition:'0/3',reward:'骰子:3, 普通寶箱:1',daily:true,on:true},{id:uid(),name:'消耗體力100',condition:'0/100',reward:'骰子:3',daily:true,on:true}],
packs:[{id:uid(),name:'廣告骰子禮包',priceResource:'廣告',price:1,limit:1,planned:1,daily:true,contents:'骰子:2',on:true},{id:uid(),name:'寶石骰子禮包',priceResource:'寶石',price:1000,limit:7,planned:0,daily:true,contents:'骰子:10',on:true},{id:uid(),name:'火龍果汁禮包 I',priceResource:'付費點數',price:1000,limit:2,planned:0,daily:true,contents:'火龍果汁:2, 寶箱:2, 寶石:1200',on:true}],
progress:[90,180,300,450,650].map((v,i)=>({id:uid(),tier:i+1,threshold:v,rewards:'火龍果汁隨機箱:1, 寶石:'+(50+i*50),on:true})),
exchange:[{id:uid(),kind:'高級',name:'覺醒核心自選箱',costResource:'火龍果汁',cost:25,limit:5,rewards:'覺醒核心自選箱:1',on:true},{id:uid(),kind:'普通',name:'一般資源箱',costResource:'奇異果汁',cost:5,limit:20,rewards:'一般資源箱:1',on:true}]};render();calc()}
function resetAll(){if(confirm('確定全部重設？')){localStorage.removeItem('activitySim');location.reload()}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#'+b.dataset.p).classList.add('on');if(b.dataset.p==='summary')calc()});
try{let o=JSON.parse(localStorage.getItem('activitySim'));if(o){db=o.db;apply(o.settings);render();calc()}else example()}catch{example()}
</script></body></html>
